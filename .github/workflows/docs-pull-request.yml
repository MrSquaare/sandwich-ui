name: "@sandwich-ui/docs Pull Request"

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/docs-pull-request.yml"
      - "apps/docs/**"

jobs:
  setup:
    runs-on: ubuntu-latest
    name: Setup

    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-env

  build:
    needs: setup
    runs-on: ubuntu-latest
    name: Build

    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Build
        run: pnpm build --filter @sandwich-ui/docs

  lint:
    needs: setup
    runs-on: ubuntu-latest
    name: Analyze

    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Check
        run: pnpm check --filter @sandwich-ui/docs

  docker:
    runs-on: ubuntu-latest
    name: Build Docker Image

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          file: ./apps/docs/Dockerfile
          tags: image:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
