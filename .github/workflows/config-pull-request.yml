name: "Configuration Pull Request"

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/config-pull-request.yml"
      - "packages/eslint-config/**"
      - "packages/eslint-config-react/**"

jobs:
  checks:
    runs-on: ubuntu-latest
    name: Checks

    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Check @sandwich-ui/eslint-config
        run: pnpm check --filter @sandwich-ui/eslint-config

      - name: Check @sandwich-ui/eslint-config-react
        run: pnpm check --filter @sandwich-ui/eslint-config-react
