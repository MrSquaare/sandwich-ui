name: "@sandwich-ui/react-storybook Pull Request"

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/react-storybook-pull-request.yml"
      - "apps/react-storybook/**"
      - "packages/react/**"

jobs:
  checks:
    runs-on: ubuntu-latest
    name: Checks

    steps:
      - uses: actions/checkout@v7

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Build
        run: pnpm build --filter @sandwich-ui/react-storybook

      - name: Check
        run: pnpm check --filter @sandwich-ui/react-storybook

  docker:
    runs-on: ubuntu-latest
    name: Build Docker Image

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          file: ./apps/react-storybook/Dockerfile
          tags: image:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
